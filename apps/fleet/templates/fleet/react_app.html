                                            <label className="text-slate-400 block mb-1">Price per Liter ($)</label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={quickFuel.cost_per_liter}
                                                onChange={e => setQuickFuel({ ...quickFuel, cost_per_liter: parseFloat(e.target.value) || 0 })}
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white font-mono"
                                            />
                                        </div>
                                    </div>
                                    <div className="p-3 bg-slate-850 rounded-xl text-center text-xs text-amber-400 font-bold">
                                        Total Amount: ${(quickFuel.liters * quickFuel.cost_per_liter).toFixed(2)}
                                    </div>
                                    <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                                        <button type="button" onClick={() => setFuelModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-semibold">Submit Fuel Receipt</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ========================================================
        // 10. Admin User & Role Management View (Role: Admin Only)
        // ========================================================
        function UserManagementView({ showToast }) {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);

            const loadUsers = async () => {
                setLoading(true);
                try {
                    const data = await apiRequest('/users/');
                    setUsers(data.results || data);
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadUsers();
            }, []);

            const handleRoleChange = async (userId, newRole) => {
                try {
                    await apiRequest(`/users/${userId}/update_role/`, {
                        method: 'POST',
                        body: JSON.stringify({ role: newRole })
                    });
                    showToast(`Updated user role to ${newRole}!`);
                    loadUsers();
                } catch (e) {
                    showToast(e.message, 'error');
                }
            };

            return (
                <div className="space-y-4">
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow flex items-center justify-between">
                        <div>
                            <h3 className="font-bold text-white text-base flex items-center gap-2">
                                <Icons.Users /> Role-Based Access Control (RBAC) Management
                            </h3>
                            <p className="text-xs text-slate-400">Manage user accounts and role assignments (Admin, Fleet Manager, Driver)</p>
                        </div>
                        <span className="text-xs font-mono font-bold px-3 py-1 bg-brand-500/20 text-brand-300 rounded-xl border border-brand-500/30">
                            Superuser Authority
                        </span>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs">
                                <thead className="bg-slate-850 text-slate-400 uppercase tracking-wider text-[10px] border-b border-slate-800">
                                    <tr>
                                        <th className="p-3.5">ID</th>
                                        <th className="p-3.5">Username</th>
                                        <th className="p-3.5">Full Name</th>
                                        <th className="p-3.5">Email</th>
                                        <th className="p-3.5">Linked Driver</th>
                                        <th className="p-3.5">Current Role</th>
                                        <th className="p-3.5 text-right">Change Role</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60">
                                    {users.map(u => (
                                        <tr key={u.id} className="hover:bg-slate-800/40 transition">
                                            <td className="p-3.5 font-mono text-slate-500">#{u.id}</td>
                                            <td className="p-3.5 font-bold text-white">{u.username}</td>
                                            <td className="p-3.5 text-slate-300">{u.first_name} {u.last_name}</td>
                                            <td className="p-3.5 text-slate-400">{u.email}</td>
                                            <td className="p-3.5 text-brand-300 font-medium">{u.driver_name || 'None'}</td>
                                            <td className="p-3.5">
                                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${
                                                    u.role === 'admin' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' :
                                                    u.role === 'manager' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' :
                                                    'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                                                }`}>
                                                    {u.role || 'driver'}
                                                </span>
                                            </td>
                                            <td className="p-3.5 text-right">
                                                <select
                                                    value={u.role || 'driver'}
                                                    onChange={(e) => handleRoleChange(u.id, e.target.value)}
                                                    className="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white"
                                                >
                                                    <option value="admin">Administrator</option>
                                                    <option value="manager">Fleet Manager</option>
                                                    <option value="driver">Driver</option>
                                                </select>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // Mount React application into DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
